<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landmark 3D</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23d9a23a'/%3E%3Cpath transform='translate(4 4)' fill='%232b2219' d='M3 21V9l6-4v4l6-4v16H3zm14 0V3h4v18h-4z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/vendor/maplibre-gl.css">
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="lm-page">
  <header class="topbar">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 21V9l6-4v4l6-4v16H3zm14 0V3h4v18h-4z"/></svg></span>
      Landmark 3D
      <span class="sub">File GLB và các version đã dùng của từng building · hướng và toạ độ neo của từng version</span>
    </div>
    <a class="btn small" href="/">← Building Data Studio</a>
  </header>

  <main class="lm-shell">
    <aside class="lm-list" aria-label="Danh sách landmark">
      <div class="lm-list-head">
        <h2>Landmark</h2><span class="hint" id="lmCount"></span>
      </div>
      <input type="text" id="lmSearch" placeholder="Tìm tên, building_id, ID liên kết" autocomplete="off" spellcheck="false" aria-label="Tìm landmark">
      <ul class="lm-items" id="lmItems"></ul>
      <div class="lm-list-foot">
        <div class="hint">Thư mục lưu: <span class="mono" id="lmDir"></span></div>
        <div class="btn-row">
          <button class="btn small" type="button" id="lmOpenDir">Mở thư mục</button>
          <a class="btn small" href="/api/landmarks/manifest.json?download=1" download title="Version đang dùng của mọi landmark, kèm hướng và toạ độ neo">Tải manifest</a>
        </div>
      </div>
    </aside>

    <section class="lm-map" aria-label="Bản đồ">
      <div id="map"></div>
      <details class="lm-mapctl" id="mapCtl" open>
        <summary>Bản đồ</summary>
        <div class="lm-mapctl-body">
          <label class="field"><span>Building từ PMTiles</span><select id="srcSel"></select></label>
          <div class="hint" id="srcNote"></div>
          <label class="field"><span>Bản đồ nền</span>
            <select id="baseSel">
              <option value="vmap">VMAP streets-v2 (nền app Mobile)</option>
              <option value="positron">Sáng (OpenFreeMap Positron)</option>
              <option value="dark">Tối (OpenFreeMap Dark)</option>
              <option value="liberty">Chi tiết (OpenFreeMap Liberty)</option>
              <option value="osm">OpenStreetMap (raster)</option>
              <option value="none">Không nền (offline)</option>
            </select>
          </label>
          <div class="field" id="vmapControls" hidden>
            <span id="presetLabel">Ánh sáng bản đồ</span>
            <div class="seg" id="presetSeg" role="group" aria-labelledby="presetLabel"></div>
            <div class="hint" id="presetNote"></div>
            <div class="btn-row"><a class="btn small" id="presetDownload" href="#" download>Tải style.json chế độ này</a></div>
          </div>
          <div class="hint" id="baseNote" style="color:var(--warn-ink)"></div>
        </div>
      </details>
      <div class="lm-legend" id="mapLegend"></div>
      <div class="zoomnote" id="pickNote" hidden>Click lên bản đồ để đặt toạ độ neo · Esc để huỷ</div>
    </section>

    <aside class="lm-detail" id="lmDetail" aria-live="polite"></aside>
  </main>

  <script type="importmap">{ "imports": { "three": "/static/vendor/three/build/three.module.js" } }</script>
  <script src="/static/vendor/maplibre-gl.js"></script>
  <script src="/static/vendor/pmtiles.js"></script>
  <script type="module" src="/static/landmarks.js"></script>
</body>
</html>
