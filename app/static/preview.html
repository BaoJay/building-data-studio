<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xem PMTiles 3D</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23d9a23a'/%3E%3Cpath transform='translate(4 4)' fill='%232b2219' d='M3 21V9l6-4v4l6-4v16H3zm14 0V3h4v18h-4z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/vendor/maplibre-gl.css">
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    /* Riêng trang bản đồ; panel, chú giải, popup, ghi chú zoom nằm trong app.css. */
    html, body { height: 100%; }
    body { overflow: hidden; }
    #map { position: absolute; inset: 0; background: var(--map-ground); }
    .collapse-btn { display: none; }
    @media (max-width: 640px) {
      .panel.collapsed > :not(.head) { display: none; }
      .collapse-btn { display: inline-flex; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <aside class="panel" id="panel">
    <div class="head">
      <div><h1 id="title">Đang tải…</h1><div class="meta" id="meta"></div></div>
      <button class="btn small collapse-btn" id="collapseBtn" type="button">Thu gọn</button>
    </div>
    <label class="field" id="layerField" hidden><span>Layer</span><select id="layerSel"></select></label>
    <label class="field"><span>Tô màu theo</span><select id="colorSel"></select></label>
    <div class="legend" id="legend"></div>
    <label class="check"><input type="checkbox" id="threeD" checked> Dựng 3D</label>
    <label class="check" id="hideParentsWrap" hidden><input type="checkbox" id="hideParents" checked>Ẩn outline có khối con (<code>has_parts</code>)</label>
    <label class="field"><span>Bản đồ nền</span>
      <select id="baseSel">
        <option value="positron">Sáng (OpenFreeMap Positron)</option>
        <option value="dark">Tối (OpenFreeMap Dark)</option>
        <option value="liberty">Chi tiết (OpenFreeMap Liberty)</option>
        <option value="osm">OpenStreetMap (raster)</option>
        <option value="none">Không nền (offline)</option>
      </select>
    </label>
    <div class="hint" id="baseNote" style="color:var(--warn-ink)"></div>
    <div class="hint">Click building để xem thuộc tính. Chuột phải (hoặc Ctrl) + kéo để xoay / nghiêng. Bản đồ nền cần internet.</div>
  </aside>
  <div class="zoomnote" id="zoomNote" hidden></div>
  <div class="zbadge" id="zBadge"></div>

  <script src="/static/vendor/maplibre-gl.js"></script>
  <script src="/static/vendor/pmtiles.js"></script>
  <script src="/static/preview.js"></script>
</body>
</html>
